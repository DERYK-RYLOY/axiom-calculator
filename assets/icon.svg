<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243447"/>
      <stop offset="0.55" stop-color="#131b26"/>
      <stop offset="1" stop-color="#080c12"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#454d57"/>
      <stop offset="1" stop-color="#1d232b"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e6bd"/>
      <stop offset="1" stop-color="#9fbf88"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="1" stop-color="#e07d18"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="6" y="6" width="500" height="500" rx="107" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <ellipse cx="256" cy="470" rx="150" ry="26" fill="#000" opacity="0.5" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <rect x="126" y="74" width="260" height="364" rx="34" fill="url(#body)"/>
    <rect x="136" y="84" width="240" height="344" rx="27" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="2"/>

    <!-- LCD -->
    <rect x="158" y="106" width="196" height="78" rx="12" fill="#0b120c"/>
    <rect x="164" y="112" width="184" height="66" rx="9" fill="url(#lcd)"/>
    <g fill="#22321f" font-family="Consolas,Menlo,monospace" font-size="34" font-weight="bold">
      <text x="338" y="158" text-anchor="end">42.7</text>
    </g>
    <rect x="172" y="120" width="46" height="6" rx="3" fill="#5c7d50" opacity="0.7"/>

    <!-- solar strip -->
    <g fill="#15293c">
      <rect x="300" y="100" width="46" height="12" rx="3"/>
      <rect x="352" y="100" width="8" height="12" rx="3"/>
    </g>

    <!-- keys -->
    <g fill="#606a76">
      <rect x="160" y="206" width="42" height="38" rx="9"/><rect x="212" y="206" width="42" height="38" rx="9"/>
      <rect x="264" y="206" width="42" height="38" rx="9"/><rect x="316" y="206" width="38" height="38" rx="9" fill="#8a7448"/>
      <rect x="160" y="254" width="42" height="38" rx="9"/><rect x="212" y="254" width="42" height="38" rx="9"/>
      <rect x="264" y="254" width="42" height="38" rx="9"/><rect x="316" y="254" width="38" height="38" rx="9" fill="#8a7448"/>
      <rect x="160" y="302" width="42" height="38" rx="9"/><rect x="212" y="302" width="42" height="38" rx="9"/>
      <rect x="264" y="302" width="42" height="38" rx="9"/>
    </g>
    <rect x="316" y="302" width="38" height="38" rx="9" fill="url(#orange)"/>
    <rect x="160" y="350" width="94" height="38" rx="9" fill="#606a76"/>
    <rect x="264" y="350" width="90" height="38" rx="9" fill="url(#orange)"/>
    <g font-family="Consolas,monospace" font-size="20" font-weight="bold" fill="#231000" text-anchor="middle">
      <text x="335" y="376">=</text>
    </g>
  </g>
</svg>
